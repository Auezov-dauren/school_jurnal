<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электронный журнал посещаемости</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background: #f4f6f9; color: #333; }
    h1, h2, h3 { color: #2c3e50; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #fff; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: center; white-space: nowrap; }
    th { background-color: #1e293b; color: white; font-weight: 600; }
    .student-name { text-align: left; font-weight: 500; }
    .me-row { background-color: #e0f2fe !important; font-weight: bold; }
    .me-row td { color: #0369a1; }
    button { cursor: pointer; padding: 8px 14px; border: none; border-radius: 6px; background: #2563eb; color: white; font-weight: 500; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    input, select { padding: 7px 10px; margin: 5px 0; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; }
    .flex-gap { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .nav-tabs button { background: #64748b; }
    .nav-tabs button.active { background: #0f172a; }
  </style>

  <!-- Подключаем Firebase старой стабильной версии (SDK 8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <!-- Экран входа -->
  <div id="authScreen" class="card" style="max-width: 350px; margin: 100px auto; text-align: center;">
    <h2>🔐 Вход в журнал</h2>
    <p style="color: #64748b; font-size: 14px;">Введите ваши данные</p>
    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
      <input type="text" id="loginInput" placeholder="Логин (например: admin)">
      <input type="password" id="passInput" placeholder="Пароль">
      <button onclick="tryLogin()" style="background: #2563eb; margin-top: 10px; width: 100%;">Войти</button>
    </div>
  </div>

  <!-- Основной контент -->
  <div id="appContent" style="display: none;">
    <div class="nav-tabs">
      <button id="tabJournalBtn" class="active" onclick="showTab('journal')">📖 Журнал посещаемости</button>
      <button id="tabAdminBtn" onclick="showTab('admin')" style="display: none;">⚙️ Админ-панель</button>
      <button onclick="logout()" style="background: #ef4444; margin-left: auto;">Выйти</button>
    </div>

    <!-- Вкладка: Журнал -->
    <div id="journalSection" class="card">
      <h2>Журнал посещаемости</h2>
      <div class="flex-gap" style="margin-bottom: 15px;">
        <input type="text" id="newDateInput" placeholder="Введите дату (напр. 22.10.2026)" style="width: auto;">
        <button onclick="addDateColumn()">+ Добавить дату</button>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr id="headerRow">
              <th>№</th>
              <th style="text-align: left;">Ф.И.О. обучающегося</th>
            </tr>
          </thead>
          <tbody id="studentRows"></tbody>
        </table>
      </div>
    </div>

    <!-- Вкладка: Админ-панель -->
    <div id="adminSection" class="card" style="display: none;">
      <h2>Управление пользователями и учениками</h2>
      
      <h3>Добавить ученика</h3>
      <div style="max-width: 320px; display: flex; flex-direction: column; margin-bottom: 20px;">
        <input type="text" id="newStudentName" placeholder="ФИО ученика">
        <button onclick="addStudent()" style="background: #2563eb; margin-top: 5px;">Добавить ученика</button>
      </div>

      <h3>Создать / Изменить пользователя</h3>
      <div style="max-width: 320px; display: flex; flex-direction: column;">
        <input type="text" id="usernameInput" placeholder="Логин">
        <input type="password" id="passwordInput" placeholder="Пароль">
        <select id="roleSelect">
          <option value="Староста">Староста</option>
          <option value="Зам. старосты">Зам. старосты</option>
          <option value="Кл. руководитель">Классный руководитель</option>
        </select>
        <button onclick="addUser()" style="margin-top: 10px; background: #9333ea;">Сохранить аккаунт</button>
      </div>

      <h3 style="margin-top: 30px;">Список пользователей</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Логин</th>
              <th>Ранг (Роль)</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="usersListTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Конфигурация вашей базы данных Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyATo6pLiD6UvdAYtV7CPQYmpdqiaX-udew",
      authDomain: "schooljurnal-209a4.firebaseapp.com",
      databaseURL: "https://schooljurnal-209a4-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "schooljurnal-209a4",
      storageBucket: "schooljurnal-209a4.firebasestorage.app",
      messagingSenderId: "819006496621",
      appId: "1:819006496621:web:ef7d0bdf8cc2534868464",
      measurementId: "G-K62BCK991H"
    };

    // Инициализация
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let globalData = { students: [], dates: [], attendanceData: {}, users: [] };

    function loadDataFromFirebase(callback) {
      db.ref('journal').once('value').then((snapshot) => {
        if (snapshot.exists()) {
          const val = snapshot.val();
          globalData.students = val.students ? (Array.isArray(val.students) ? val.students.filter(s => s) : Object.values(val.students)) : [];
          globalData.dates = val.dates || [];
          globalData.attendanceData = val.attendanceData || {};
          globalData.users = val.users ? Object.values(val.users) : [];
        }
        if (callback) callback();
      }).catch((error) => {
        alert("Ошибка загрузки данных: " + error.message);
      });
    }

    function saveDatatoFirebase() {
      db.ref('journal').set(globalData);
    }

    window.tryLogin = function() {
      const login = document.getElementById("loginInput").value.trim().toLowerCase();
      const pass = document.getElementById("passInput").value.trim();

      if (!login || !pass) {
        alert("Введите логин и пароль!");
        return;
      }

      loadDataFromFirebase(() => {
        if (!globalData.users || globalData.users.length === 0) {
          alert("В базе данных нет пользователей! Проверьте Firebase.");
          return;
        }

        const found = globalData.users.find(u => u && u.login && u.login.toLowerCase() === login && String(u.pass) === pass);
        
        if (found) {
          localStorage.setItem("school_logged_user", JSON.stringify(found));
          openApp(found);
        } else {
          alert("Неверный логин или пароль!");
        }
      });
    }

    function openApp(user) {
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("appContent").style.display = "block";
      
      if (["Кл. руководитель", "Староста", "Зам. старосты"].includes(user.role)) {
        document.getElementById("tabAdminBtn").style.display = "block";
      }

      renderTable();
      renderUsers();
    }

    window.logout = function() {
      localStorage.removeItem("school_logged_user");
      document.getElementById("authScreen").style.display = "block";
      document.getElementById("appContent").style.display = "none";
      document.getElementById("loginInput").value = "";
      document.getElementById("passInput").value = "";
    }

    function renderTable() {
      loadDataFromFirebase(() => {
        const headerRow = document.getElementById("headerRow");
        if (!headerRow) return;
        headerRow.innerHTML = '<th>№</th><th style="text-align: left;">Ф.И.О. обучающегося</th>';
        
        globalData.dates.forEach(date => {
          const th = document.createElement("th");
          th.textContent = date;
          headerRow.appendChild(th);
        });

        const tbody = document.getElementById("studentRows");
        if (!tbody) return;
        tbody.innerHTML = "";

        globalData.students.forEach((student, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>${index + 1}</td><td class="student-name">${student.name}</td>`;

          globalData.dates.forEach(date => {
            const td = document.createElement("td");
            const currentValue = (globalData.attendanceData[date] && globalData.attendanceData[date][index]) || "";
            
            td.innerHTML = `
              <select onchange="updateAttendance('${date}', ${index}, this.value)">
                <option value="" ${currentValue === '' ? 'selected' : ''}>—</option>
                <option value="П" ${currentValue === 'П' ? 'selected' : ''}>П (Был)</option>
                <option value="Н" ${currentValue === 'Н' ? 'selected' : ''}>Н (Н/Б)</option>
                <option value="Б" ${currentValue === 'Б' ? 'selected' : ''}>Б (Болен)</option>
              </select>
            `;
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });
      });
    }

    window.addStudent = function() {
      const nameInput = document.getElementById("newStudentName");
      const name = nameInput.value.trim();
      if (!name) return alert("Введите ФИО!");
      
      loadDataFromFirebase(() => {
        globalData.students.push({ name });
        saveDatatoFirebase();
        nameInput.value = "";
        renderTable();
        alert("Ученик успешно добавлен!");
      });
    }

    window.addDateColumn = function() {
      const dateInput = document.getElementById("newDateInput");
      const newDate = dateInput.value.trim();
      if (!newDate) return alert("Введите дату!");
      
      loadDataFromFirebase(() => {
        if (!globalData.dates.includes(newDate)) {
          globalData.dates.push(newDate);
          if (!globalData.attendanceData[newDate]) globalData.attendanceData[newDate] = {};
          saveDatatoFirebase();
          dateInput.value = "";
          renderTable();
        } else {
          alert("Такая дата уже есть!");
        }
      });
    }

    window.updateAttendance = function(date, studentIndex, value) {
      loadDataFromFirebase(() => {
        if (!globalData.attendanceData[date]) globalData.attendanceData[date] = {};
        globalData.attendanceData[date][studentIndex] = value;
        saveDatatoFirebase();
      });
    }

    window.showTab = function(tab) {
      document.getElementById("journalSection").style.display = tab === 'journal' ? 'block' : 'none';
      document.getElementById("adminSection").style.display = tab === 'admin' ? 'block' : 'none';
      document.getElementById("tabJournalBtn").classList.toggle("active", tab === 'journal');
      const adminBtn = document.getElementById("tabAdminBtn");
      if(adminBtn) adminBtn.classList.toggle("active", tab === 'admin');
      if(tab === 'admin') renderUsers();
    }

    window.addUser = function() {
      const login = document.getElementById("usernameInput").value.trim().toLowerCase();
      const pass = document.getElementById("passwordInput").value.trim();
      const role = document.getElementById("roleSelect").value;
      
      if (!login || !pass) return alert("Заполните логин и пароль");
      
      loadDataFromFirebase(() => {
        const existing = globalData.users.find(u => u && u.login && u.login.toLowerCase() === login);
        if (existing) {
          existing.pass = pass;
          existing.role = role;
        } else {
          globalData.users.push({ login, pass, role });
        }
        
        saveDatatoFirebase();
        document.getElementById("usernameInput").value = "";
        document.getElementById("passwordInput").value = "";
        renderUsers();
        alert("Пользователь сохранен!");
      });
    }

    window.renderUsers = function() {
      loadDataFromFirebase(() => {
        const tbody = document.getElementById("usersListTable");
        if (!tbody) return;
        tbody.innerHTML = "";
        globalData.users.forEach(u => {
          if (!u) return;
          tbody.innerHTML += `
            <tr>
              <td>${u.login}</td>
              <td><b>${u.role}</b></td>
              <td><button onclick="removeUser('${u.login}')" style="background:#ef4444; padding: 4px 8px;">Удалить</button></td>
            </tr>
          `;
        });
      });
    }

    window.removeUser = function(login) {
      loadDataFromFirebase(() => {
        globalData.users = globalData.users.filter(u => u && u.login !== login);
        saveDatatoFirebase();
        renderUsers();
      });
    }

    // Автоматический вход при обновлении страницы, если сессия сохранена
    window.onload = function() {
      const savedUser = localStorage.getItem("school_logged_user");
      if (savedUser) {
        loadDataFromFirebase(() => {
          openApp(JSON.parse(savedUser));
        });
      }
    }
  </script>
</body>
</html>
